name: clean_up
description: "Clean Up Community Mobile Apps"
publish_to: 'none'
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  cupertino_icons: ^1.0.9
  firebase_auth: ^6.5.0
  firebase_core: ^4.8.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.1
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.0
  flutter_svg: ^2.3.0
  freezed_annotation: ^3.1.0
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  go_router: ^17.2.3
  json_annotation: ^4.11.0
  latlong2: ^0.9.1
  permission_handler: ^12.0.0+1
  toasty_box: ^1.0.4

dev_dependencies:
  build_runner: ^2.15.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  patrol: ^4.5.0
  freezed: ^3.2.5
  json_serializable: ^6.13.2

patrol:
  app_name: Clean Up Community App
  android:
    package_name: com.example.clean_up_community
  ios:
    bundle_id: com.example.cleanUpCommunity

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/images/
    - .env