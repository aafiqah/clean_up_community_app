name: clean_up
description: "Clean Up Community Mobile Apps"
publish_to: 'none'
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.9.2

dependencies:
  cupertino_icons: ^1.0.8
  firebase_auth: ^5.5.3
  firebase_core: ^3.13.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_dotenv: ^6.0.0
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.1.1
  flutter_svg: ^2.1.0
  freezed_annotation: ^2.4.1
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  go_router: ^17.2.1
  json_annotation: ^4.8.1
  latlong2: ^0.9.1
  permission_handler: ^12.0.0+1
  toasty_box: ^1.0.4

dev_dependencies:
  melos: ^6.3.2
  build_runner: ^2.4.6
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  patrol: 3.15.2
  freezed: ^2.4.6
  json_serializable: ^6.9.2

patrol:
  app_name: Clean Up Community App
  android:
    package_name: com.example.clean_up_community_app
  ios:
    bundle_id: com.example.cleanUpCommunity

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/images/
    - .env
    - .env.development
    - .env.staging
