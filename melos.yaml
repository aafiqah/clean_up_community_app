name: clean_up_community_melos

packages:
  - apps/clean_up
  - packages/**

flutter:
  assets:
    - apps/clean_up/assets/icons/
    - apps/clean_up/assets/images/

command:
  bootstrap:
    usePubspecOverrides: true
    runPubGetInParallel: true

scripts:

  # ───────────────────────────────
  # 🧹 CLEANUP & MAINTENANCE
  # ───────────────────────────────
  clean:
    run: melos exec -- fvm flutter clean
    description: "Clean build outputs for all packages"

  format:
    run: melos exec -- fvm dart format .
    description: "Format all Dart files"

  analyze:
    run: melos exec -- fvm flutter analyze
    description: "Analyze all packages"

  # ───────────────────────────────
  # 📦 DEPENDENCY MANAGEMENT
  # ───────────────────────────────
  get:
    run: melos exec -- fvm flutter pub get
    description: "Get dependencies for all packages"

  setup:
    run: |
      melos run clean &&
      melos bootstrap --verbose --no-private &&
      melos run get --no-select &&
      melos run gen-l10n &&
      melos run build_runner
    description: "Full setup: clean, bootstrap, get deps, gen-l10n, build_runner"

  # ───────────────────────────────
  # ⚙️ CODE GENERATION
  # ───────────────────────────────
  build_runner:
    run: melos exec -- fvm dart run build_runner build --delete-conflicting-outputs
    packageFilters:
      dependsOn: build_runner
    description: "Run build_runner for all packages"

  gen-l10n:
    run: melos exec -- fvm flutter gen-l10n
    description: "Generate localization files"

  # ───────────────────────────────
  # 🚀 RUN FLAVORS
  # ───────────────────────────────
  run:staging:
    run: fvm flutter run --flavor staging -t lib/main_staging.dart
    exec:
      concurrency: 1
    packageFilters:
      scope: clean_up

  run:production:
    run: fvm flutter run --flavor production -t lib/main_production.dart
    exec:
      concurrency: 1
    packageFilters:
      scope: clean_up

  run:development:
    run: fvm flutter run --flavor development -t lib/main_development.dart
    exec:
      concurrency: 1
    packageFilters:
      scope: clean_up

  # ───────────────────────────────
  # 🧱 BUILD
  # ───────────────────────────────
  clean:staging:
    run: fvm flutter clean && bash android/gradlew clean assembleStagingDebug -p android -Ptarget=lib/main_staging.dart
    packageFilters:
      scope: clean_up

  clean:production:
    run: fvm flutter clean && bash android/gradlew clean assembleRelease -p android -Ptarget=lib/main_production.dart
    packageFilters:
      scope: clean_up

  clean:development:
    run: fvm flutter clean && bash android/gradlew clean assembleRelease -p android -Ptarget=lib/main_development.dart
    packageFilters:
      scope: clean_up

  # ───────────────────────────────
  # 🍏 iOS
  # ───────────────────────────────
  gen-pod:
    run: |
      cd apps/clean_up/ios && \
      rm -f Podfile.lock && \
      rm -rf Pods/ && \
      flutter precache --ios && \
      pod install --repo-update
    packageFilters:
      scope: clean_up
